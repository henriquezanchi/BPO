<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Como pagar pelo Portal</title>
<!--
  Passo a passo para os membros (23/11/2026). Uma fonte só para três saídas (scripts/gerar-guia-membros.ts):
  ?f=pdf (A4), ?f=img (imagem única 1080 px para o WhatsApp) e ?f=quadro&n=0..7 (quadros 1080×1920 do vídeo).
  Telas REAIS do Portal (docs/guias/telas, scripts/capturar-telas-guia.ts e a simulação /pagar?demo=1).
-->
<style>
  :root { --verde: #086357; --verde-esc: #0f3d33; --verde-cl: #e3f1ea; --fundo: #f3f7f5; --texto: #1d2a25; --cinza: #5c6b65; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "DejaVu Sans", Arial, sans-serif; color: var(--texto); background: #fff; }
  b { color: var(--verde-esc); }

  /* Celular com a captura real (390×844) */
  .cel { width: 230px; border-radius: 30px; background: #111; padding: 9px; flex: none; box-shadow: 0 10px 24px rgba(0,0,0,.16); }
  .cel img { display: block; width: 100%; aspect-ratio: 390 / 844; object-fit: cover; object-position: top; border-radius: 22px; background: #fff; }

  .num { width: 46px; height: 46px; border-radius: 50%; background: var(--verde); color: #fff; font-weight: 900; font-size: 22px; display: flex; align-items: center; justify-content: center; flex: none; }
  .texto h2 { margin: 8px 0 6px; font-size: 22px; color: var(--verde-esc); line-height: 1.15; }
  .texto p { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
  .dica { font-size: 13px !important; color: var(--cinza); }

  /* PDF (A4) */
  .pdf .capa { background: var(--verde); color: #fff; padding: 26px 30px; border-radius: 0 0 22px 22px; }
  .pdf .capa h1 { margin: 0 0 4px; font-size: 30px; }
  .pdf .capa p { margin: 0; font-size: 15px; opacity: .9; }
  .pdf .lista { display: grid; gap: 26px; padding: 24px 30px; }
  .pdf .passo { display: flex; gap: 26px; align-items: center; break-inside: avoid; }
  .pdf .rodape { margin: 0 30px 20px; padding: 14px 16px; background: var(--fundo); border-radius: 14px; font-size: 13px; line-height: 1.5; break-inside: avoid; }

  /* Imagem única (WhatsApp) */
  body.img { width: 1080px; }
  .img .capa { background: var(--verde); color: #fff; padding: 56px 60px 48px; }
  .img .capa h1 { margin: 0 0 8px; font-size: 64px; line-height: 1.05; }
  .img .capa p { margin: 0; font-size: 30px; opacity: .92; }
  .img .telas { display: flex; gap: 18px; justify-content: center; padding: 40px 30px 10px; }
  .img .telas .cel { width: 236px; padding: 8px; border-radius: 28px; }
  .img .lista { display: grid; gap: 20px; padding: 30px 60px 24px; }
  .img .item { display: flex; gap: 26px; align-items: flex-start; }
  .img .num { width: 68px; height: 68px; font-size: 34px; }
  .img .item h2 { margin: 4px 0 2px; font-size: 36px; color: var(--verde-esc); }
  .img .item p { margin: 0; font-size: 27px; line-height: 1.35; }
  .img .fim { margin: 10px 60px 56px; padding: 30px 36px; border-radius: 26px; background: var(--verde-cl); font-size: 28px; line-height: 1.4; }
  .img .fim b { font-size: 36px; }

  /* Quadros do vídeo (1080×1920) */
  body.quadro { width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); }
  .quadro .q { height: 1920px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; padding: 80px; text-align: center; }
  .quadro .cel { width: 560px; padding: 18px; border-radius: 64px; }
  .quadro .cel img { border-radius: 48px; }
  .quadro .num { width: 104px; height: 104px; font-size: 54px; margin: 0 auto; }
  .quadro h2 { font-size: 72px; margin: 22px 0 14px; color: var(--verde-esc); line-height: 1.08; }
  .quadro p { font-size: 40px; margin: 0; line-height: 1.35; }
  .quadro .grande { font-size: 92px; font-weight: 900; color: var(--verde-esc); line-height: 1.05; }
  .quadro .sub { font-size: 46px; color: var(--cinza); }
  .quadro .url { font-size: 54px; font-weight: 900; color: var(--verde); background: #fff; padding: 22px 36px; border-radius: 30px; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const LINK = "portal-na-one.vercel.app/pagar";
const APP = "portal-na-one.vercel.app/app";
const T = (n) => `<div class="cel"><img src="telas/${n}.png" alt=""></div>`;

const passos = [
  { tela: "01-entrar", t: "Abra o link de pagamento", p: `No celular, acesse <b>${LINK}</b> e toque em <b>Entrar com a conta Nova Acrópole</b>.`, d: "É o mesmo link do QR code do pátio da escola." },
  { tela: "02-login-acropole", t: "Entre com o seu e-mail", p: `Use o <b>e-mail cadastrado na secretaria</b> e a sua senha, ou <b>Continuar com o Google</b>.`, d: "Primeira vez? Toque em Cadastre-se, use esse mesmo e-mail e confirme pelo link que chega na sua caixa de entrada." },
  { tela: "04-contribuicao", t: "Confira a sua contribuição", p: `O Portal mostra o mês e o valor, e já prepara o seu Pix.`, d: "" },
  { tela: "05-cpf", t: "Só na primeira vez: o CPF", p: `Digite o <b>CPF de quem vai pagar</b> e toque em <b>Gerar Pix</b>. Nas próximas vezes o Portal já lembra.`, d: "Prefere cartão? Toque em Prefiro pagar no cartão." },
  { tela: "06-pix", t: "Pague no app do banco", p: `Toque em <b>Copiar o código</b>, abra o app do seu banco em <b>Pix → Pix Copia e Cola</b>, cole, confira o valor e confirme.`, d: "Pode deixar esta tela aberta: ela avisa quando o banco confirmar." },
  { tela: "07-pago", t: "Pronto!", p: `Aparece <b>Pagamento confirmado</b>. O pagamento é registrado sozinho, e o recibo fica no Portal.`, d: "" },
];

const q = new URLSearchParams(location.search);
const f = q.get("f") || "pdf";
document.body.className = f;
const raiz = document.getElementById("raiz");

if (f === "pdf") {
  raiz.innerHTML = `<div class="capa"><h1>Como pagar a contribuição pelo Portal</h1><p>Pelo celular, com Pix ou cartão. Leva 2 minutos.</p></div>
  <div class="lista">${passos.map((s, i) => `<div class="passo">${T(s.tela)}<div class="texto"><div class="num">${i + 1}</div><h2>${s.t}</h2><p>${s.p}</p>${s.d ? `<p class="dica">${s.d}</p>` : ""}</div></div>`).join("")}</div>
  <div class="rodape">Quer o Portal como app? Android: <b>${APP}</b>. iPhone: no Safari, toque em Compartilhar → Adicionar à Tela de Início.<br>No Portal você também vê a agenda e os eventos da escola e corrige seus dados em <b>Meus dados</b>.<br>Dúvidas? Fale com a secretaria da sua escola.</div>`;
} else if (f === "img") {
  raiz.innerHTML = `<div class="capa"><h1>Pague sua contribuição pelo Portal</h1><p>Pelo celular, com Pix ou cartão, em 2 minutos</p></div>
  <div class="telas">${["01-entrar", "04-contribuicao", "06-pix", "07-pago"].map(T).join("")}</div>
  <div class="lista">${passos.map((s, i) => `<div class="item"><div class="num">${i + 1}</div><div><h2>${s.t}</h2><p>${s.p}</p></div></div>`).join("")}</div>
  <div class="fim"><b>${LINK}</b><br>Primeira vez? Cadastre-se com o e-mail da secretaria.<br>App para Android: ${APP}</div>`;
} else {
  const n = Number(q.get("n") || 0);
  if (n === 0) raiz.innerHTML = `<div class="q"><img src="../../public/na-logo.png" style="width:420px" alt=""><div class="grande">Como pagar sua contribuição pelo Portal</div><div class="sub">Pix ou cartão, pelo celular</div></div>`;
  else if (n <= passos.length) {
    const s = passos[n - 1];
    raiz.innerHTML = `<div class="q"><div><div class="num">${n}</div><h2>${s.t}</h2><p>${s.p}</p></div>${T(s.tela)}</div>`;
  } else raiz.innerHTML = `<div class="q"><div class="grande">Pronto para começar?</div><div class="url">${LINK}</div><p>App para Android:<br><b>${APP}</b></p><p class="sub">Dúvidas? Fale com a secretaria da sua escola.</p></div>`;
}
</script>
</body>
</html>
