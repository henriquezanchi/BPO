# Ponte do Portal para *.acropolebrasil.com.br (ver src/index.ts).
# Publicar: npx wrangler deploy (dentro desta pasta)
# Segredo:  npx wrangler secret put PONTE_CHAVE
name = "ponte-portal-na"
main = "src/index.ts"
compatibility_date = "2026-10-22"
workers_dev = true

# Roda fixo fora de São Paulo: em GRU o Cloudflare da Nova Acrópole desafia a ponte (teste de 22/10).
[placement]
region = "aws:us-east-1"
