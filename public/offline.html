<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#086357" />
    <title>Sem conexão · Portal NA</title>
    <style>
      :root { color-scheme: light dark; --fundo: #f4f6f8; --texto: #1f2937; --suave: #4b5563; --verde: #086357; --no-verde: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --fundo: #030712; --texto: #f3f4f6; --suave: #9ca3af; --verde: #34d399; --no-verde: #022c22; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 320px; padding: 24px; text-align: center; }
      .marca { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px; background: #086357; color: #ffca00; display: grid; place-items: center; font-weight: 700; font-size: 22px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: var(--suave); margin: 0 0 20px; }
      button { border: 0; border-radius: 12px; padding: 12px 20px; background: var(--verde); color: var(--no-verde); font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="marca" aria-hidden="true">NA</div>
      <h1>Sem conexão com a internet</h1>
      <p>O Portal precisa de internet para mostrar seus dados atualizados. Confira a conexão e tente de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
