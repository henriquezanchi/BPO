# Checagem a cada envio (sugerido em docs/OPORTUNIDADES-MERCURIO-2026-11-06.md): tipos, lint e testes.
# Não acessa banco nem segredos: as URLs abaixo são de mentira, só para o `prisma generate` do postinstall.
# A Vercel publica independentemente; um X vermelho aqui avisa que algo subiu quebrado.
name: Checagem

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: checagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checagem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint --quiet
      - name: Testes
        run: npm test
